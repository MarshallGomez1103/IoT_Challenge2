<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de cableado de referencia del Water Monitoring System</title>
  <desc id="desc">ESP32 Dev Module con HC-SR04, divisor de tensión, DHT11, LDR, BMP180, LCD I2C, LED RGB, buzzer y botón. Los pines coinciden con el firmware local.</desc>
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#e8eef5}.title{font-size:29px;font-weight:700}.subtitle{font-size:15px;fill:#9fb0c0}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#bdc9d5}.pin{font-size:14px;font-weight:700;fill:#70d7c0}.box{fill:#121d29;stroke:#314354;stroke-width:2}.esp{fill:#182a39;stroke:#58c8b4;stroke-width:3}.warning{fill:#332b1c;stroke:#c79e50;stroke-width:2}.power{stroke:#e9ad54;stroke-width:3;fill:none}.ground{stroke:#8796a4;stroke-width:3;fill:none}.signal{stroke:#5bcab4;stroke-width:3;fill:none}.i2c{stroke:#85aef4;stroke-width:3;fill:none}.alertline{stroke:#f0797e;stroke-width:3;fill:none}.join{fill:#e8eef5}.badge{fill:#1b3437;stroke:#32675e;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5bcab4"/></marker>
    <marker id="bluearrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#85aef4"/></marker>
  </defs>
  <rect width="1440" height="980" rx="24" fill="#0a1119"/>
  <text x="48" y="57" class="title">WMS · Cableado de referencia para Proteus</text>
  <text x="49" y="84" class="subtitle">Mapa según los GPIO del sketch local · cotejar módulos físicos antes de energizar</text>

  <!-- Sensors on the left -->
  <rect x="48" y="125" width="380" height="180" rx="18" class="box"/>
  <text x="72" y="158" class="head">HC-SR04 · distancia</text>
  <text x="72" y="190" class="body">VCC → 5V/VIN · GND → GND común</text>
  <text x="72" y="220" class="pin">TRIG → GPIO18</text>
  <text x="72" y="248" class="pin">ECHO → divisor → GPIO19</text>
  <rect x="66" y="262" width="341" height="30" rx="8" class="warning"/>
  <text x="78" y="283" class="small">R1 1 kΩ serie · R2 1.8 kΩ del nodo a GND</text>

  <rect x="48" y="330" width="380" height="132" rx="18" class="box"/>
  <text x="72" y="365" class="head">DHT11 · temperatura / humedad</text>
  <text x="72" y="399" class="pin">DATA → GPIO27</text>
  <text x="72" y="427" class="body">VCC → 3V3 · GND común</text>
  <text x="72" y="450" class="small">Sensor desnudo: pull-up 10 kΩ a 3V3</text>

  <rect x="48" y="488" width="380" height="155" rx="18" class="box"/>
  <text x="72" y="523" class="head">LDR · luz relativa</text>
  <text x="72" y="556" class="body">3V3 ─ 10 kΩ ─┬─ GPIO34 / ADC</text>
  <text x="72" y="584" class="body">                 └─ LDR ─ GND</text>
  <text x="72" y="618" class="small">Más luz → menor ADC con esta orientación</text>

  <!-- ESP32 central -->
  <rect x="490" y="176" width="455" height="500" rx="24" class="esp"/>
  <text x="526" y="220" class="head">ESP32 Dev Module</text>
  <text x="526" y="247" class="small">Firmware: ESP32_WMS_Challenge2.ino</text>
  <line x1="526" y1="268" x2="909" y2="268" stroke="#385163" stroke-width="2"/>
  <text x="526" y="306" class="pin">GPIO18  · TRIG HC-SR04</text>
  <text x="526" y="342" class="pin">GPIO19  · ECHO protegido</text>
  <text x="526" y="378" class="pin">GPIO27  · DHT11 DATA</text>
  <text x="526" y="414" class="pin">GPIO34  · LDR ADC</text>
  <text x="526" y="450" class="pin">GPIO21  · SDA I²C</text>
  <text x="526" y="486" class="pin">GPIO22  · SCL I²C</text>
  <text x="526" y="522" class="pin">GPIO25 / 26 / 32 · LED RGB</text>
  <text x="526" y="558" class="pin">GPIO33  · Buzzer activo en LOW</text>
  <text x="526" y="594" class="pin">GPIO14  · Botón a GND</text>
  <rect x="522" y="615" width="390" height="42" rx="10" class="badge"/>
  <text x="540" y="642" class="small">USB → alimentación ESP32 · 3V3 y 5V/VIN según módulo</text>

  <!-- I2C modules -->
  <rect x="1000" y="125" width="390" height="180" rx="18" class="box"/>
  <text x="1025" y="160" class="head">Bus I²C compartido</text>
  <text x="1025" y="194" class="body">BMP180: SDA / SCL · VCC según breakout</text>
  <text x="1025" y="224" class="body">LCD 16×2: dirección configurada 0x27</text>
  <text x="1025" y="254" class="pin">SDA → GPIO21 · SCL → GPIO22</text>
  <text x="1025" y="283" class="small">Backpack con pull-up a 5V: conversor I²C bidireccional</text>

  <rect x="1000" y="330" width="390" height="142" rx="18" class="box"/>
  <text x="1025" y="365" class="head">LED RGB · ánodo común</text>
  <text x="1025" y="400" class="body">Ánodo común → 3V3</text>
  <text x="1025" y="430" class="pin">R → 220–330 Ω → GPIO25</text>
  <text x="1025" y="458" class="pin">G → 220–330 Ω → GPIO26 · B → GPIO32</text>

  <rect x="1000" y="497" width="390" height="146" rx="18" class="box"/>
  <text x="1025" y="532" class="head">Buzzer y botón</text>
  <text x="1025" y="566" class="pin">Buzzer SIG/IN → GPIO33 (LOW activa)</text>
  <text x="1025" y="595" class="body">Buzzer desnudo / alta corriente: usar driver</text>
  <text x="1025" y="624" class="pin">Botón: GPIO14 ↔ botón ↔ GND</text>

  <!-- labeled routing hints -->
  <path d="M428 219 H466 V305 H490" class="signal" marker-end="url(#arrow)"/>
  <path d="M428 389 H462 V376 H490" class="signal" marker-end="url(#arrow)"/>
  <path d="M428 560 H470 V414 H490" class="signal" marker-end="url(#arrow)"/>
  <path d="M945 450 H975 V213 H1000" class="i2c" marker-end="url(#bluearrow)"/>
  <path d="M945 486 H965 V235 H1000" class="i2c" marker-end="url(#bluearrow)"/>
  <path d="M945 522 H982 V401 H1000" class="signal" marker-end="url(#arrow)"/>
  <path d="M945 558 H970 V565 H1000" class="alertline"/>
  <path d="M945 594 H980 V622 H1000" class="signal"/>

  <!-- shared ground / safety notes -->
  <path d="M65 710 H1380" class="ground"/>
  <circle cx="245" cy="710" r="5" class="join"/><circle cx="700" cy="710" r="5" class="join"/><circle cx="1195" cy="710" r="5" class="join"/>
  <text x="65" y="698" class="small">Riel de GND común: sensores · ESP32 · LCD · LED · buzzer · fuente 5 V</text>
  <rect x="48" y="755" width="1342" height="168" rx="18" class="warning"/>
  <text x="76" y="793" class="head">Antes de montar</text>
  <text x="76" y="827" class="body">• GPIO del ESP32 no es tolerante a 5 V: ECHO requiere divisor; SDA/SCL también requieren protección si el backpack los eleva a 5 V.</text>
  <text x="76" y="859" class="body">• No conectes VCC de un módulo al ESP32 solo por el nombre del sensor: verifica el breakout, su regulador y sus pull-ups.</text>
  <text x="76" y="891" class="body">• El esquema refleja el firmware; completa el modelo de placa, referencias y componentes reales en Proteus antes de presentarlo como montaje final.</text>
</svg>
